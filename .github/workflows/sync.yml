name: Sync Canvas to Google Tasks

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing Google Tasks"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: canvas-google-tasks-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Sync or preview
        env:
          CANVAS_AUTH_KEY: ${{ secrets.CANVAS_AUTH_KEY }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL || 'https://canvas.uoregon.edu' }}
          CANVAS_COURSE_IDS: ${{ vars.CANVAS_COURSE_IDS }}
          GOOGLE_TASKLIST_ID: ${{ vars.GOOGLE_TASKLIST_ID }}
          GOOGLE_TASKLIST_NAME: ${{ vars.GOOGLE_TASKLIST_NAME || 'School' }}
          SYNC_TIMEZONE: ${{ vars.SYNC_TIMEZONE || 'America/Los_Angeles' }}
          CANVAS_DUE_OVERRIDES: ${{ vars.CANVAS_DUE_OVERRIDES || '{}' }}
          PLANNER_LOOKBACK_DAYS: ${{ vars.PLANNER_LOOKBACK_DAYS || '120' }}
          PLANNER_AHEAD_DAYS: ${{ vars.PLANNER_AHEAD_DAYS || '365' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            python main.py --apply
          fi
